[workspace]
name = "rhapsodist"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
channel-priority = "strict"

[dependencies]
python = "==3.12.15"
snakemake = "==9.27.0"
pulp = ">=2.3.1,<3.3"  # Snakemake 9.27 uses the pre-PuLP-4 scheduler API.
cutadapt = "==4.9"
seqtk = "==1.5"
pigz = "==2.8"
bash = "*"
coreutils = "*"
numpy = ">=1.24,<3"
scipy = ">=1.18,<2"
pandas = ">=2.0,<4"
anndata = ">=0.11,<1"
h5py = ">=3.8,<4"
pyyaml = ">=6,<7"
pip = "*"
setuptools = ">=68"

simpleaf = "==0.30.0"
piscem = "==0.23.0"
alevin-fry = "==0.18.3"
