name: velocity checks
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  velocity-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the locked runtime
        run: |
          curl -fsSL https://pixi.sh/install.sh | PIXI_VERSION=v0.83.0 PIXI_NO_PATH_UPDATE=1 bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          "$HOME/.pixi/bin/pixi" install --locked
      - name: Check preprocessing, conversion, exports, CLI, and dry-run DAG
        run: |
          export VELOCITY_CUTADAPT_PYTHON="$PWD/.pixi/envs/default/bin/python"
          export VELOCITY_PREPROCESS_BIN="$PWD/.pixi/envs/default/bin"
          export VELOCITY_SNAKEMAKE="$PWD/.pixi/envs/default/bin/snakemake"
          export VELOCITY_SIMPLEAF="$PWD/.pixi/envs/default/bin/simpleaf"
          export PYTHONWARNINGS=error::DeprecationWarning,error::FutureWarning
          pixi run --locked python tests/velocity/test_velocity.py
          pixi run --locked python -m unittest discover -s tests -p test_cli.py
          pixi run --locked python tests/velocity/synthetic_e2e.py
          bash -n container_build.sh slurm/velocity.sbatch
